<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Royal Home{% endblock %}</title>

    <!-- Main Stylesheet with ID for theme switching -->
    <link id="theme-stylesheet" rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Instant Theme Loader -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('store_theme');
            if (savedTheme === 'style-2.css') {
                document.getElementById('theme-stylesheet').href = "{{ url_for('static', filename='css/style-2.css') }}";
            }
        })();
    </script>
</head>
<body>

    <!-- Header & Navigation (Displays on all pages) -->
    <header id="siteHeader">
        <nav>
            <div class="logo">{{ tenant_name if tenant_name else "Royal Home" }}</div>
            
            <!-- Hamburger Toggle Button -->
            <button type="button" class="nav-toggle" aria-label="Toggle navigation menu" id="navToggle">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <ul id="primaryNav">
                <li><a href="#about">About</a></li>
                <li><a href="#products">Products</a></li>
                <li><a href="#gallery">Gallery</a></li>
                <li><a href="#contact">Contact</a></li>
                <li><a href="/store-saas">← Back to Store-SaaS</a></li>
                <li>
                    <button type="button" id="themeToggleBtn" class="nav-store-login-btn" style="cursor: pointer;">
                        🎨 Theme: Classic
                    </button>
                </li>
            </ul>
        </nav>
    </header>

    <!-- Main Content Injected Here -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer>
        <p>
            © 2026 Discount Appliance Outlet. All Rights Reserved.
            <a href="/login" class="hidden-link" title="">·</a>
        </p>
    </footer>

    <!-- Theme Switcher Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeLink = document.getElementById('theme-stylesheet');
            const toggleBtn = document.getElementById('themeToggleBtn');

            const style1Url = "{{ url_for('static', filename='css/style.css') }}";
            const style2Url = "{{ url_for('static', filename='css/style-2.css') }}";

            let currentTheme = localStorage.getItem('store_theme') || 'style.css';
            updateButtonLabel(currentTheme);

            if (currentTheme === 'style-2.css' && themeLink) {
                themeLink.href = style2Url;
            }

            if (toggleBtn) {
                toggleBtn.addEventListener('click', () => {
                    if (currentTheme === 'style.css') {
                        themeLink.href = style2Url;
                        currentTheme = 'style-2.css';
                    } else {
                        themeLink.href = style1Url;
                        currentTheme = 'style.css';
                    }
                    localStorage.setItem('store_theme', currentTheme);
                    updateButtonLabel(currentTheme);
                });
            }

            function updateButtonLabel(theme) {
                if (!toggleBtn) return;
                toggleBtn.textContent = (theme === 'style-2.css') 
                    ? '🎨 Theme: Exotic Light' 
                    : '🎨 Theme: Classic';
            }
        });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const navToggle = document.getElementById('navToggle');
            const primaryNav = document.getElementById('primaryNav');

            if (navToggle && primaryNav) {
                navToggle.addEventListener('click', () => {
                    navToggle.classList.toggle('is-open');
                    primaryNav.classList.toggle('nav-open');
                });

                // Close mobile menu automatically when a link is clicked
                primaryNav.querySelectorAll('a').forEach(link => {
                    link.addEventListener('click', () => {
                        navToggle.classList.remove('is-open');
                        primaryNav.classList.remove('nav-open');
                    });
                });
            }
        });
    </script>
</body>
</html>
